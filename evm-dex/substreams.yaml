specVersion: v0.1.0
package:
  name: evm_dex
  version: v0.9.0
  url: https://github.com/pinax-network/substreams-evm-dex
  description: |
    DEX swaps, swap fees and pool initializations into the Token API DEX
    ClickHouse tables. Ported from substreams-evm evm-dex v0.8.0.

imports:
  # Normalized swaps; imports dex/pools for its store_pools.
  dex_swaps: ../dex/swaps/substreams.yaml

# DatabaseChanges as substreams-database-change 5.0.0 encodes it (value,
# update_op), from the crate's own source. The CLI adds the SQL sink's Service
# from its built-in sf/substreams/sink/sql/v1/deprecated.proto, and refuses
# that path here.
protobuf:
  files:
    - sf/substreams/sink/database/v1/database.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/evm_dex.wasm

modules:
  - name: db_out
    kind: map
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
      - map: dex_swaps:map_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: "./clickhouse/schema.sql" # generated by `make schema`
    engine: clickhouse
    postgraphile_frontend:
      enabled: false

network: mainnet

params:
  db_out: "hex" # Supported encodings: hex, tron_base58
