specVersion: v0.1.0
package:
  name: bancor
  version: v0.9.0
  url: https://github.com/pinax-network/substreams-evm-dex
  description: |
    Bancor converter, registry and factory events (bancor.v1.Events). Ported
    from substreams-evm dex/bancor v0.8.0.
protobuf:
  files: [bancor.proto]
  importPaths: [../../proto/v1/dex]
binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/bancor.wasm
modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:bancor.v1.Events
network: mainnet
