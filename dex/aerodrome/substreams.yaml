specVersion: v0.1.0
package:
  name: aerodrome
  version: v0.9.0
  url: https://github.com/pinax-network/substreams-evm-dex
  description: |
    Aerodrome/Velodrome (Solidly fork) pool and factory events
    (aerodrome.v1.Events). Ported from substreams-evm dex/aerodrome v0.8.0.
protobuf:
  files: [aerodrome.proto]
  importPaths: [../../proto/v1/dex]
binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/aerodrome.wasm
modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:aerodrome.v1.Events
network: base
