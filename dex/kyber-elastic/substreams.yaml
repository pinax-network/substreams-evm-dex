specVersion: v0.1.0
package:
  name: kyber-elastic
  version: v0.9.0
  url: https://github.com/pinax-network/substreams-evm-dex
  description: |
    KyberSwap Elastic pool and factory events (kyber_elastic.v1.Events).
    Ported from substreams-evm dex/kyber-elastic v0.8.0.
protobuf:
  files: [kyber-elastic.proto]
  importPaths: [../../proto/v1/dex]
binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/kyber_elastic.wasm
modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:kyber_elastic.v1.Events
network: mainnet
