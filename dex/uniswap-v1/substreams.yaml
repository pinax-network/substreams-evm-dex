specVersion: v0.1.0
package:
  name: uniswap_v1
  version: v0.9.0
  url: https://github.com/pinax-network/substreams-evm-dex
  description: |
    Uniswap V1 exchange and factory events, with JustSwap TrxPurchase
    (uniswap.v1.Events). Ported from substreams-evm dex/uniswap-v1 v0.8.0.
protobuf:
  files: [uniswap-v1.proto]
  importPaths: [../../proto/v1/dex]
binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/uniswap_v1.wasm
modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:uniswap.v1.Events
network: mainnet
