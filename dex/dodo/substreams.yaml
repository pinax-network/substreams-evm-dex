specVersion: v0.1.0
package:
  name: dodo
  version: v0.9.0
  url: https://github.com/pinax-network/substreams-evm-dex
  description: |
    DODO V2 RouteProxy OrderHistory events (dodo.v1.Events). Ported from
    substreams-evm dex/dodo v0.8.0.
protobuf:
  files: [dodo.proto]
  importPaths: [../../proto/v1/dex]
binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/dodo.wasm
modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:dodo.v1.Events
network: mainnet
