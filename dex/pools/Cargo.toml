[package]
name = "dex-pools"
description = "DEX pool metadata (tokens and factory) from pool creations, as a set_if_not_exists store"
edition = { workspace = true }
version = "0.9.0"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-abis = { workspace = true }
substreams-ethereum = { workspace = true }
proto = { path = "../../proto" }

[dev-dependencies]
buffa = { workspace = true }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
