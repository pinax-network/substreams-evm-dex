[package]
name = "dex-swaps"
description = "Swaps, swap fees and pool initializations of EVM DEX protocols, normalized to dex.swaps.v1"
edition = { workspace = true }
version = "0.9.0"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-abis = { workspace = true }
substreams-ethereum = { workspace = true }
common = { path = "../../common" }
proto = { path = "../../proto" }

[dev-dependencies]
buffa = { workspace = true }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

sha2 = "0.10"
serde_json = "1"
wasmi = { version = "=0.47.2", default-features = false, features = ["std"] }
evm-dex = { path = "../../evm-dex" }
dex-pools = { path = "../pools" }
substreams-database-change = "=5.0.0"
