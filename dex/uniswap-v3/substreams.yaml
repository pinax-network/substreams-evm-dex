specVersion: v0.1.0
package:
  name: uniswap_v3
  version: v0.9.0
  url: https://github.com/pinax-network/substreams-evm-dex
  description: |
    Uniswap V3 pool and factory events (uniswap.v3.Events). Ported from
    substreams-evm dex/uniswap-v3 v0.8.0.
protobuf:
  files: [uniswap-v3.proto]
  importPaths: [../../proto/v1/dex]
binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/uniswap_v3.wasm
modules:
  - name: map_events
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:uniswap.v3.Events
network: mainnet
