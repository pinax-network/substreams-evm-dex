[package]
name = "balancer"
description = "Balancer V2 weighted pool, V3 stable pool and V3 vault events, as balancer.v1.Events"
edition = { workspace = true }
version = "0.9.0"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-abis = { workspace = true }
substreams-ethereum = { workspace = true }
common = { path = "../../common" }
proto = { path = "../../proto" }

[dev-dependencies]
common = { path = "../../common", features = ["testing"] }
