syntax = "proto3";

package uniswap.v3;

// Complete block envelope for state reconstruction. Each pool's changes are in
// canonical log order. This is not a standalone price or liquidity snapshot:
// consumers need a verified initial state and uninterrupted block continuity.
message BlockPoolChanges {
  uint64 block_number = 1;
  bytes block_hash = 2;
  bytes parent_hash = 3;
  int64 timestamp_seconds = 4;
  int32 timestamp_nanos = 5;
  repeated PoolChanges pools = 6;
}
message PoolChanges {
  bytes pool = 1;
  repeated PoolChange changes = 2;
}
message PoolChange {
  uint32 block_log_index = 1;
  uint64 ordinal = 2;
  oneof change {
    PoolPriceState initialize = 3;
    PoolPriceState swap = 4;
    PoolLiquidityChange liquidity = 5;
    InvalidPoolChange invalid = 6;
  }
}
message PoolPriceState {
  string sqrt_price_x96 = 1; // uint160, unscaled Q64.96
  int32 tick = 2; // int24, including the zero-for-one boundary convention
  string liquidity = 3; // uint128; zero for Initialize
}
message PoolLiquidityChange {
  int32 tick_lower = 1; // inclusive int24
  int32 tick_upper = 2; // exclusive int24
  string liquidity_delta = 3; // signed decimal: Mint positive, Burn negative
}

// A recognized topic with an invalid shape/value. Consumers must invalidate this
// pool rather than silently carry its previous state. No raw payload is copied.
message InvalidPoolChange { string event_name = 1; }
