[workspace]
resolver = "2"
members = [
  "proto",
  "common",
  "dex/pool-state",
  "dex/pools",
  "dex/swaps",
  "evm-dex",
  # Per-protocol raw events, and the foundational store built on them.
  "dex/aerodrome",
  "dex/balancer",
  "dex/bancor",
  "dex/cow",
  "dex/curvefi",
  "dex/dodo",
  "dex/foundational-store",
  "dex/kyber-elastic",
  "dex/sunpump",
  "dex/traderjoe",
  "dex/uniswap-v1",
  "dex/uniswap-v2",
  "dex/uniswap-v3",
  "dex/uniswap-v4",
  "dex/woofi",
]

[workspace.package]
description = "EVM DEX Substreams: swaps and pool state from Firehose blocks"
edition = "2021"
version = "0.0.0"
license = "Apache-2.0"

[workspace.dependencies]
substreams = "0.8.0"
# v2.0.0 is the port to substreams 0.8.0 and substreams-ethereum 0.12.0
# (pinax-network/substreams-abis#55).
substreams-abis = { git = "https://github.com/pinax-network/substreams-abis.git", tag = "v2.0.0" }
substreams-ethereum = "0.12.0"
# Generated messages (proto/src/pb) and test encoding; the versions substreams
# 0.8.0 and substreams-ethereum 0.12.0 are built on.
buffa = { version = "0.9.2", default-features = false, features = ["std"] }
buffa-types = { version = "0.9.2", default-features = false, features = ["std"] }

[profile.release]
lto = true
