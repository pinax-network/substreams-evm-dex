name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup >= 1.28 installs the toolchain, components and targets that
      # rust-toolchain.toml pins, so CI and local builds share one pin.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustc -vV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Offline regression tests
        run: cargo test --locked --workspace --lib --bins --tests
      # The v0.8.0 oracle's interpreter is a dev dependency: no workspace crate
      # may reach wasmi (or its wasmi_* crates) through a normal or build edge,
      # on any target.
      - name: Keep the historical interpreter out of shipped dependencies
        run: |
          cargo tree --locked --workspace --target all --edges normal,build --prefix none > "$RUNNER_TEMP/runtime-dependencies.txt"
          if grep -E '^wasmi([_-][[:alnum:]_-]+)? v' "$RUNNER_TEMP/runtime-dependencies.txt" > "$RUNNER_TEMP/wasmi.txt"; then
            sort -u "$RUNNER_TEMP/wasmi.txt"
            # A wasmi_* crate can be reached without wasmi itself: invert each match.
            for package in $(awk '{ print $1 "@" substr($2, 2) }' "$RUNNER_TEMP/wasmi.txt" | sort -u); do
              cargo tree --locked --workspace --target all --edges normal,build --invert "$package"
            done
            exit 1
          fi
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Host builds never compile the `#[cfg(target_arch = "wasm32")]` handlers.
      - name: Clippy (wasm32)
        run: cargo clippy --locked --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: WASM check
        run: cargo check --locked --workspace --target wasm32-unknown-unknown
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps --workspace
          cargo doc --locked --no-deps --workspace --target wasm32-unknown-unknown
